<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noora | Beauty parlour & ladies' fashion</title>
    <meta
      name="description"
      content="Shop ladies’ clothing and book beauty parlour services. Order on WhatsApp."
    />
    <meta property="og:title" content="Noora" />
    <meta
      property="og:description"
      content="Shop ladies’ clothing and book beauty parlour services. Order on WhatsApp."
    />
    <meta property="og:type" content="website" />
    <!--
      Storefront fonts: Cormorant Garamond (display) and Plus Jakarta Sans (UI). The stylesheet
      loads without blocking first paint (media=print swapped on load); font-display=swap keeps
      text visible in the system fallback meanwhile.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <style>
      /* Visible keyboard focus everywhere (WCAG 2.4.7). Colour comes from index.css. */
      :focus-visible {
        outline: 3px solid var(--bs-accent, #9d174d);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
